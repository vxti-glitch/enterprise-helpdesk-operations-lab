name: Validate portfolio lab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate canonical data and generated artifacts
        run: python tools/labtool.py validate --strict-baseline
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Lint Python source
        run: |
          python -m pip install --disable-pip-version-check ruff==0.8.6
          python -m ruff format --check tools tests
          python -m ruff check tools tests

  console:
    name: Static console checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify static-console JavaScript
        run: |
          node --check web/app.js
          node --test web/filters.test.mjs
      - name: Run browser interaction and accessibility checks
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Verify generated console data is fresh
        run: |
          python tools/labtool.py generate --strict-baseline
          git diff --exit-code -- web/data/lab.json tickets/generated docs/metrics evidence/generated data/servicenow_import

  powershell-safety:
    name: PowerShell safety checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned test tooling
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.6.1 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
      - name: Parse PowerShell source
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/powershell/* -Include *.ps1,*.psm1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $failed = $true; $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" } }
          }
          if ($failed) { exit 1 }
      - name: Run containment tests and analyzer
        shell: pwsh
        run: |
          Invoke-Pester -Path tests/powershell -CI
          $findings = Invoke-ScriptAnalyzer -Path scripts/powershell -Recurse -Severity Error
          if ($findings) { $findings | Format-Table -AutoSize; exit 1 }

  package:
    name: Reproducible archive check
    runs-on: ubuntu-latest
    needs: [validate, console]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Create commit-exact archive and checksum
        run: python tools/labtool.py package
      - name: Verify archive integrity
        run: |
          python -c "import glob, hashlib, pathlib, zipfile; archive=pathlib.Path(glob.glob('dist/*.zip')[0]); names=zipfile.ZipFile(archive).namelist(); assert zipfile.ZipFile(archive).testzip() is None; assert all(name.startswith('enterprise-helpdesk-operations-lab/') for name in names); assert 'enterprise-helpdesk-operations-lab/README.md' in names; expected=archive.with_suffix(archive.suffix + '.sha256').read_text(encoding='ascii').split()[0]; assert expected == hashlib.sha256(archive.read_bytes()).hexdigest(); print(f'Archive and checksum verified: {archive}')"

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
